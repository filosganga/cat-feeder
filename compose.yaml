name: cat-feeder-dev

# Local development stack: the broker and Home Assistant the firmware talks to,
# so firmware work needs nothing but this machine. See dev/README.md.
#
#   docker compose up -d
#
# Broker only:  docker compose up -d mosquitto
#
# The broker's credentials default to feeder / feeder-dev and can be changed
# with MQTT_USER and MQTT_PASS, in the environment or in a .env file beside
# this one. Whatever they are, they also go in the firmware's cfg.toml.

services:
  # Creates the password file before the broker can try to read it. There used
  # to be a `dev/bootstrap.sh` for this, run once by hand; folding it in means
  # `docker compose up -d` works from a fresh clone with no separate step.
  #
  # Two things here are load-bearing rather than tidy:
  #
  # `mosquitto_passwd -b` **without** -c. The -c flag creates, which means it
  # truncates: it would delete every other user in the file. Without it this
  # adds or updates one user and leaves the rest alone. The cost is that
  # changing MQTT_USER leaves the old user behind, so clearing the file is a
  # deliberate `docker compose down && rm dev/mosquitto/passwd` — which is the
  # right way round.
  #
  # `touch` first, because mosquitto_passwd will not create the file itself
  # without -c, and because the broker below bind-mounts `passwd` as a *file*:
  # if it is missing when that container starts, Docker silently creates a
  # **directory** there and the broker fails in a way that reads as a config
  # error. `depends_on` prevents that for `up` — but only for `up`. A plain
  # `docker compose restart mosquitto`, or the daemon restarting it under
  # `restart: unless-stopped`, does not re-run this service, so deleting the
  # password file is something to do with the stack down.
  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: cat-feeder-mosquitto-init
    volumes:
      - ./dev/mosquitto:/config
    environment:
      MQTT_USER: ${MQTT_USER:-feeder}
      MQTT_PASS: ${MQTT_PASS:-feeder-dev}
    # $$ escapes compose's own interpolation, so the shell in the container
    # sees $MQTT_USER rather than an empty string.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        touch /config/passwd
        chmod 0600 /config/passwd
        mosquitto_passwd -b /config/passwd "$$MQTT_USER" "$$MQTT_PASS"
        chmod 0600 /config/passwd
        echo "broker credentials: $$MQTT_USER"


  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cat-feeder-mosquitto
    restart: unless-stopped
    ports:
      # Published on all interfaces so the ESP32 can reach it over Wi-Fi,
      # not just the Mac.
      - "1883:1883"
    volumes:
      - ./dev/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./dev/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: cat-feeder-ha
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      # Home Assistant owns the clock for this project, so its timezone is
      # what ends up in feeder/time.
      TZ: Europe/Rome
    volumes:
      - ./dev/homeassistant:/config
    depends_on:
      - mosquitto

volumes:
  # Named rather than a bind mount so `docker compose down -v` wipes every
  # retained message in one go. That is the only way to test a cold boot.
  mosquitto-data:
