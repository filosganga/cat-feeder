name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # CLAUDE.md is loaded into every Claude Code session, so it has a budget;
  # see its "Keeping this file small". Raise the number only deliberately.
  claude-md-budget:
    name: CLAUDE.md line budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md: $lines lines (budget 400)"
          test "$lines" -le 400

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check
          # One run per board rather than --all-features: the two board
          # features pick different esp-println outputs, and esp-println's
          # build script refuses both at once, so --all-features never
          # compiles. Headless is the build on the perfboards.
          - command: clippy
            args: --workspace -- -D warnings
          - command: clippy
            args: --workspace --no-default-features --features board-zero -- -D warnings
          - command: clippy
            args: --workspace --no-default-features --features board-zero,headless -- -D warnings
          # Pure-logic tests. These need an explicit host target, because
          # .cargo/config.toml points cargo at the board by default.
          - command: test
            args: --lib --target x86_64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: riscv32imac-unknown-none-elf, x86_64-unknown-linux-gnu
          toolchain: stable
          components: rust-src, rustfmt, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
