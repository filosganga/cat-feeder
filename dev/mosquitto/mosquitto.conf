# Dev broker for cat-feeder. Mirrors the production Mosquitto closely enough
# that the firmware cannot tell them apart: same port, same authentication,
# same retained-message behaviour.

listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwd

# Retained messages must survive a broker restart. The whole design treats the
# broker as the only persistent store, so losing them silently would hide real
# bugs during development.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Logs every connect, disconnect and bad authentication. This is the fastest
# way to see whether the ESP32 is reaching the broker at all.
connection_messages true
