# Home Assistant's half of the cat-feeder contract.
#
# Each feeder owns its schedule and keeps it in flash, and keeps its clock on
# a battery-backed RTC. This file publishes the time every minute, which is
# what corrects that clock. If Home Assistant stops, the feeders keep feeding
# on what they hold.
#
# Meals are set on a feeder, never here: on its device page, through the
# "Meal n time" and "Meal n portions" entities it announces by itself, or on
# its own admin page. "Cat feeder: copy one feeder's meals to others" then
# makes others match it. Being given a schedule is a deliberate act, so a
# feeder that joins the broker is not handed meals nobody chose for it.
#
# Install: see "Home Assistant automations" in dev/README.md. The same file goes
# to the local Docker stack and to any deployed instance, unchanged — nothing in
# it names a host, which is why it is tracked in the firmware repo at all.
#
# ---------------------------------------------------------------------------
# NO DEVICE ID APPEARS IN THIS FILE, and adding a feeder needs no edit here.
# Time is a shared retained topic and feed is a broadcast. Pause and the
# schedule copy publish to each unit's own topic, and find their units in the
# device registry by the `model` that MQTT discovery published -- see the
# `units` variable in "Cat feeder: pause the schedule when away".
# ---------------------------------------------------------------------------

# Whether the automatic schedule should run at all. Drag the blocks in the UI
# rather than editing automations: a bank holiday is then one gesture, not a
# code change.
#
# Defaults to every day, all day, so the feeders run normally until you say
# otherwise.
schedule:
  cat_feeder_active:
    name: Cat feeder active
    icon: mdi:cat
    monday: &all_day
      - from: "00:00:00"
        to: "24:00:00"
    tuesday: *all_day
    wednesday: *all_day
    thursday: *all_day
    friday: *all_day
    saturday: *all_day
    sunday: *all_day

script:
  cat_feeder_feed_all:
    alias: "Cat feeder: feed every unit now"
    description: >-
      Publishes one broadcast so all three feeders turn at the same instant,
      which is the requirement this whole project exists for. Feeding each unit
      in turn would stagger them by the round trip.
    mode: single
    fields:
      portions:
        name: Portions
        description: >-
          Portions per feeder. Each unit turns them into clicks at its own
          portion scale, and caps one request at 16 clicks (MAX_CLICKS).
        default: 1
        selector:
          number:
            min: 1
            max: 16
    sequence:
      # Deliberately NOT retained. A retained feed command is replayed on every
      # reconnect, and because manual feeds accumulate, a boot loop would empty
      # the hopper.
      - action: mqtt.publish
        data:
          topic: feeder/all/feed
          retain: false
          payload: "{{ portions | int(1) }}"

  # Makes other feeders eat what one feeder eats: reads the source's meals
  # from its "Meal n" entities and publishes them, as a whole schedule, to
  # each target's own feeder/<id>/schedule. Each target stores them in flash
  # and echoes what it holds on feeder/<id>/schedule/state, which is what its
  # own Meal n entities then show.
  #
  # Per unit rather than one broadcast, so *every feeder* and *the ones with
  # this label* are the same loop. Nothing is lost by not broadcasting: a meal
  # fires from each unit's own clock at its slot's time, so copies landing
  # milliseconds apart change nothing. See
  # docs/adr/0015-syncing-schedules-is-a-copy-in-home-assistant.md.
  #
  # Refuses rather than half-copies:
  #   - a source that is offline: its entities are unavailable, and reading
  #     them as "no meals" would wipe every target;
  #   - a source whose Meal n entity ids were renamed, so cannot be found;
  #   - a source with no meals: copying blank is not a copy anyone means;
  #   - a target that is offline: the command is not retained, so it would
  #     miss it and silently disagree with the rest;
  #   - a selection with no feeders in it, rather than falling back to all.
  #
  # Not retained, and the firmware refuses a retained one: a retained schedule
  # would be handed to every unit that subscribes later.
  cat_feeder_copy_schedule:
    alias: "Cat feeder: copy one feeder's meals to others"
    icon: mdi:content-copy
    mode: single
    fields:
      source:
        name: From
        description: The feeder whose meals are copied.
        required: true
        selector:
          device:
            filter:
              - integration: mqtt
                model: cat-feeder ESP32-C6
      to:
        name: To
        description: >-
          Feeders, an area, a floor or a label. Leave empty for every other
          feeder. Devices that are not feeders are ignored.
        required: false
        selector:
          target:
            device:
              - integration: mqtt
                model: cat-feeder ESP32-C6
    sequence:
      - variables:
          # Every feeder's device id, found the same way as pause's `units`.
          # `model` is a contract with src/discovery.rs.
          feeders: >-
            {{ integration_entities('mqtt') | map('device_id') | reject('none')
               | unique | select('is_device_attr', 'model', 'cat-feeder ESP32-C6')
               | list }}
          # What `to` names, expanded to device ids.
          picked: >-
            {%- set t = to if to is mapping else {} -%}
            {%- set ns = namespace(d=[]) -%}
            {%- for key in ['device_id', 'area_id', 'floor_id', 'label_id', 'entity_id'] -%}
              {%- set v = t.get(key, []) -%}
              {%- for x in ([v] if v is string else v) -%}
                {%- if key == 'device_id' -%}
                  {%- set ns.d = ns.d + [x] -%}
                {%- elif key == 'area_id' -%}
                  {%- set ns.d = ns.d + area_devices(x) -%}
                {%- elif key == 'floor_id' -%}
                  {%- for a in floor_areas(x) -%}
                    {%- set ns.d = ns.d + area_devices(a) -%}
                  {%- endfor -%}
                {%- elif key == 'label_id' -%}
                  {%- set ns.d = ns.d + label_devices(x) -%}
                {%- else -%}
                  {%- set ns.d = ns.d + [device_id(x)] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.d | reject('none') | unique | list }}
          # Whether anything was picked at all. Tested on `to` itself, not on
          # `picked`: a label or area with no devices in it expands to nothing,
          # and must be refused rather than read as "every feeder".
          chose: >-
            {{ to is mapping and to.values() | select | list | count > 0 }}
          targets: >-
            {{ (picked if chose else feeders)
               | select('in', feeders) | reject('eq', source) | unique | list }}
          # Targets that are offline, by name. A unit's availability_topic is
          # shared by all of its entities, so any unavailable one means down.
          down: >-
            {%- set ns = namespace(n=[]) -%}
            {%- for d in targets -%}
              {%- if device_entities(d) | select('is_state', 'unavailable') | list | count > 0 -%}
                {%- set ns.n = ns.n + [device_attr(d, 'name_by_user') or device_attr(d, 'name')] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.n }}
          # Found by entity id, as `<domain>.<anything>_meal_<n>_<time|portions>`,
          # so renaming the device keeps working; renaming those entity ids
          # does not, and is reported as such rather than as "offline".
          found: >-
            {{ device_entities(source) | select('match', 'time\\..*_meal_1_time$')
               | list | count > 0 }}
          # The source's meals, from its Meal n entities, in position order.
          # Positions past the end of its schedule read `unknown`, so the
          # first one ends the list. A switched-off meal (0 portions) is
          # copied as it is, keeping every later meal's number.
          meals: >-
            {%- set ents = device_entities(source) -%}
            {%- set ns = namespace(m=[], done=false, bad=false) -%}
            {%- for n in range(1, 9) -%}
              {%- if ns.done -%}{%- continue -%}{%- endif -%}
              {%- set t = ents | select('match', 'time\\..*_meal_' ~ n ~ '_time$') | first | default(none) -%}
              {%- set p = ents | select('match', 'number\\..*_meal_' ~ n ~ '_portions$') | first | default(none) -%}
              {%- set ts = states(t) if t else 'unavailable' -%}
              {%- set ps = states(p) if p else 'unavailable' -%}
              {%- if ts == 'unavailable' or ps == 'unavailable' -%}
                {%- set ns.bad = true -%}{%- set ns.done = true -%}
              {%- elif ts == 'unknown' -%}
                {%- set ns.done = true -%}
              {%- elif ps == 'unknown' -%}
                {#- Both come from the one echo, so this should not happen;
                    copying it as 0 would switch a meal off in silence. -#}
                {%- set ns.bad = true -%}{%- set ns.done = true -%}
              {%- else -%}
                {%- set ns.m = ns.m + [{'time': ts[:5], 'portions': ps | float(0) | int}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ none if ns.bad else ns.m }}
      - variables:
          source_name: "{{ device_attr(source, 'name_by_user') or device_attr(source, 'name') }}"
          problem: >-
            {%- if not found -%}
              {{ source_name }} has no Meal n entities named as this script expects (time.…_meal_1_time). Were their entity ids renamed?
            {%- elif meals is none -%}
              {{ source_name }}'s meals cannot be read: it is offline, or its Meal n entities disagree.
            {%- elif meals | count == 0 -%}
              {{ source_name }} has no meals to copy. Set them on its device page first.
            {%- elif targets | count == 0 -%}
              No other feeder is in that selection.
            {%- elif down | count > 0 -%}
              {{ down | join(', ') }} {{ 'is' if down | count == 1 else 'are' }} offline and would miss the copy. Pick the others, or try again once it is back.
            {%- endif -%}
      # `stop` takes no template, so the reason goes in a notification.
      - if: "{{ problem | length > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: cat_feeder_copy_schedule
              title: "Cat feeder: meals not copied"
              message: "{{ problem }} Nothing was copied."
          - stop: "Meals not copied; see the notification for why."
            error: true
      - action: persistent_notification.dismiss
        data:
          notification_id: cat_feeder_copy_schedule
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: >-
                  {%- set ids = device_attr(repeat.item, 'identifiers') | list
                       | selectattr(0, 'eq', 'mqtt') | map(attribute=1)
                       | select('match', 'feeder_') | list -%}
                  feeder/{{ ids[0] | replace('feeder_', '') }}/schedule
                retain: false
                payload: "{{ meals | to_json }}"

automation:
  - id: cat_feeder_publish_time
    alias: "Cat feeder: publish the time"
    description: >-
      The authority on the feeders' clocks while Home Assistant is running.
      Each unit also keeps time itself -- a DS3231 on a coin cell, and its own
      timezone for the summer-time change -- so a set RTC arms the schedule at
      boot with no broker at all. This publish is what corrects that clock,
      rewrites the RTC when it drifts, and outranks the unit's own timezone;
      the unit falls back to its zone only after ten minutes without one.
      Every minute, retained.

      Also answers feeder/time/request. A retained time never arms a
      schedule, because it can be any age; only a *live* one does. A unit with
      no trusted RTC would otherwise sit idle until the next tick, so it asks
      once per MQTT connection and this replies at once. The answer is an
      ordinary publish, so it still proves Home Assistant is running now, which
      is the whole point of the live versus retained rule.

      That trigger belongs here rather than in a second automation: two
      automations publishing the same topic is how they drift apart. mode:
      single is fine — three feeders rebooting together send three requests
      within milliseconds and two are dropped, but the one publish that happens
      is forwarded live to all three subscribers.

      Must be now(), never utcnow(). The firmware reads the wall-clock fields
      and records the offset without converting away from it, because slots
      are local times and the feeders share a house with the broker.
      Publishing UTC would still look valid while moving every meal by the
      offset. The feeder logs the offset it received at startup, and its
      panel and admin page show the clock, which is where that mistake shows.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      # Published by a feeder as the last step of connecting, carrying its id.
      # Never retained, so this cannot be replayed at Home Assistant's own
      # restart.
      - trigger: mqtt
        topic: feeder/time/request
    actions:
      - action: mqtt.publish
        data:
          topic: feeder/time
          retain: true
          payload: "{{ now().isoformat() }}"

  - id: cat_feeder_pause_when_away
    alias: "Cat feeder: pause the schedule when away"
    description: >-
      Pause stops the schedule, not the feeder: a manual feed still works while
      paused, so a bowl can always be topped up by hand.

      One publish per unit. There is deliberately no feeder/all/paused, because
      two retained topics setting the same flag would race on reconnect with no
      defined winner.

      This publishes to the topic rather than calling switch.turn_on on the
      discovered switch, and that is load-bearing: entity service calls skip
      entities that are unavailable, and a feeder that is offline is exactly the
      one whose pause has to be waiting in the broker when it comes back.

      This automation is the authority on pausing. A pause or resume from a
      unit's knob, or from its switch here, is a temporary override: it lasts
      until the next Home Assistant start or the next change of the helper,
      then reverts to what the helper says.
    mode: single
    variables:
      # Every feeder Home Assistant has been told about, found rather than
      # listed. MQTT discovery gives each unit a device whose `model` is this
      # firmware's and whose `identifiers` are ["mqtt", "feeder_<id>"] -- both
      # rendered by src/discovery.rs, and neither of them changed by
      # renaming the device in the UI. So a unit added to the broker joins this
      # automation by itself, and no device id is written down anywhere here.
      #
      # `model` is a contract with the firmware: change it in discovery.rs and this
      # silently stops matching anything.
      units: >-
        {%- set ns = namespace(ids=[]) -%}
        {%- for e in integration_entities('mqtt')
                     | select('is_device_attr', 'model', 'cat-feeder ESP32-C6') -%}
          {%- set ns.ids = ns.ids +
              [(device_attr(e, 'identifiers') | list | first)[1]
               | replace('feeder_', '')] -%}
        {%- endfor -%}
        {{ ns.ids | unique | list }}
    triggers:
      # A bare state trigger also fires on attribute-only changes, and an
      # all-day schedule moves its `next_event` attribute at every midnight
      # while staying `on` -- which republished OFF and undid every pause set
      # by hand (issue #2). Naming any of from/not_from/to/not_to makes the
      # trigger ignore attribute changes; these two also keep a reload of the
      # helper, through unavailable, from firing it. (`to` and `not_to` are
      # mutually exclusive, so `to: ~` cannot be combined with `not_to`.)
      - trigger: state
        entity_id: schedule.cat_feeder_active
        not_from: [unavailable, unknown]
        not_to: [unavailable, unknown]
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each: "{{ units }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: "feeder/{{ repeat.item }}/paused"
                # Retained: unlike the schedule, `paused` is not kept in the
                # unit's flash, so a unit that reboots while paused must come
                # back paused from the broker alone.
                retain: true
                # Pauses only when the helper is explicitly off. If it is
                # unknown or unavailable the feeders keep running, because the
                # failure that matters is cats not being fed.
                payload: >-
                  {{ 'ON' if is_state('schedule.cat_feeder_active', 'off') else 'OFF' }}
