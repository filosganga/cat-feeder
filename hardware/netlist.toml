# What connects to what on the perfboard: the design, which pcb.diy must draw.
# `dev/pcb-check` compares the drawing's nets against this file and fails on
# any difference (ADR-0030).
#
# Change this first, then the drawing. The drawing only says where things sit
# and how the copper runs; this says what it is for. A drawing that agrees with
# itself can still run a data line to the wrong resistor, and nothing but a
# statement made apart from it can catch that.
#
# Each net is `[net.<name>]` with:
#   pins      every pin on it, as `Header.pin` (the names in pcb.diy and
#             hardware/pinouts.toml) or `Part.lead` (R1.1, C1.+, Q1.2). Case does
#             not matter. A resistor's two leads may be fitted either way.
#   firmware  for a net that reaches a GPIO, the src/board.rs macro that drives
#             it. The check holds the two to the same GPIO, and every macro in
#             board.rs must be claimed by a net.
#
# A pin in no net is meant to be connected to nothing. The spare ones are
# listed at the end, as a comment, for the reader.
#
# The parts come after the nets, for `dev/kicad-netlist`, which writes this
# file as a KiCad netlist.

# --- power -----------------------------------------------------------------

# The rail after the diode-OR, starred on C1's + leg (docs/hardware.md).
[net.5v]
pins = ["C1.+", "Q1.2", "ESP32C6-L.5V", "DRV8833-L.Vcc", "Ext.5V"]

[net.gnd]
pins = ["C1.-", "In.GND", "ESP32C6-L.GND", "DRV8833-L.GND", "DS3231.GND", "Ext.GND"]

# The DS3231 charges its LIR2032 from this; never from 5 V.
[net.3v3]
pins = ["ESP32C6-L.3V3", "DS3231.Vcc"]

# The two anodes of the MBRF2045CT: USB and the batteries, never joined.
[net.usb_in]
pins = ["In.Vcc", "Q1.1"]

[net.battery_in]
pins = ["In.VBatt", "Q1.3"]

# --- the motor -------------------------------------------------------------

[net.motor_in1]
pins = ["ESP32C6-L.GP0", "DRV8833-L.IN1"]
firmware = "motor_in1_pin"

[net.motor_in2]
pins = ["ESP32C6-L.GP1", "DRV8833-L.IN2"]
firmware = "motor_in2_pin"

[net.motor_sleep]
pins = ["ESP32C6-R.GP14", "DRV8833-R.ULT"]
firmware = "motor_sleep_pin"

[net.motor_1]
pins = ["DRV8833-R.OUT1", "In.Mot1"]

[net.motor_2]
pins = ["DRV8833-R.OUT2", "In.Mot2"]

# --- the hub switch, behind R1 ---------------------------------------------

[net.switch]
pins = ["ESP32C6-L.GP2", "R1.2"]
firmware = "switch_pin"

[net.switch_cable]
pins = ["In.Switch", "R1.1"]

# --- the RTC ---------------------------------------------------------------

[net.i2c_sda]
pins = ["ESP32C6-R.GP18", "DS3231.SDA"]
firmware = "i2c_sda_pin"

[net.i2c_scl]
pins = ["ESP32C6-R.GP19", "DS3231.SCL"]
firmware = "i2c_scl_pin"

# --- the LED and BOOT board, behind R2 and R3 (optional) ---------------------

# GPIO8 and GPIO9 reach the board as wires from the Zero's back pads.
[net.led]
pins = ["Pads.GP8", "R2.1"]
firmware = "led_pin"

[net.led_cable]
pins = ["R2.2", "Ext.DIN"]

[net.boot]
pins = ["Pads.GP9", "R3.1"]
firmware = "boot_button_pin"

[net.boot_cable]
pins = ["R3.2", "Ext.BOOT"]

# --- spare, connected to nothing -------------------------------------------
#
# ESP32C6-L  GP3 GP4 GP5          free; see src/board.rs
# ESP32C6-R  TX RX GP15 GP20 GP21 GP22
#            GP15 is strapping (JTAG source); TX/RX are GPIO16/17
# DRV8833-L  IN3 IN4              channel B is spare
# DRV8833-R  OUT3 OUT4 EEP

# --- parts, for the KiCad export ----------------------------------------------
#
# `[part.<ref>]`, keyed by the reference a KiCad netlist names it by:
#   value      what it is.
#   footprint  "Library:Name" from KiCad's standard library. A `cat-feeder:`
#              footprint is generated by dev/kicad-netlist from pcb.diy,
#              because no stock footprint has these modules' two rows at their
#              spacing, or their bodies.
#   symbol     "Library:Name", the KiCad symbol, for the netlist's libsource.
#   rows       a part on headers: its pin rows, by header name in pcb.diy and
#              hardware/pinouts.toml. Pins are numbered along them in pinouts order,
#              the second row carrying on from the first.
#   outline    a generated footprint's body: a rectangle's name in pcb.diy.
#   drawn      a two- or three-lead part's name in pcb.diy, if not the
#              reference. Its leads keep the drawing's numbers, C1's + being 1.
#   functions  pin names for a part without rows, in pin order.

[part.U1]
value = "ESP32-C6-Zero"
footprint = "cat-feeder:ESP32-C6-Zero"
symbol = "cat-feeder:ESP32-C6-Zero"
rows = ["ESP32C6-L", "ESP32C6-R"]
outline = "ESP32C6-board"

[part.U2]
value = "DRV8833 breakout"
footprint = "cat-feeder:DRV8833-breakout"
symbol = "cat-feeder:DRV8833-breakout"
rows = ["DRV8833-L", "DRV8833-R"]
outline = "DRV8833-board"

[part.U3]
value = "DS3231 module"
footprint = "cat-feeder:DS3231-module"
symbol = "cat-feeder:DS3231-module"
rows = ["DS3231"]
outline = "DS3231-shape"

# The feeder's cable: a plain header for the ribbon, or a JST XH 6-pin for a
# re-crimped feeder (Connector_JST:JST_XH_B6B-XH-A_1x06_P2.50mm_Vertical).
[part.J1]
value = "feeder cable"
footprint = "Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical"
symbol = "Connector_Generic:Conn_01x06"
rows = ["In"]

[part.J2]
value = "Zero back pads"
footprint = "Connector_PinSocket_2.54mm:PinSocket_1x02_P2.54mm_Vertical"
symbol = "Connector_Generic:Conn_01x02"
rows = ["Pads"]

[part.J3]
value = "LED and BOOT"
footprint = "Connector_JST:JST_XH_B4B-XH-A_1x04_P2.50mm_Vertical"
symbol = "Connector_Generic:Conn_01x04"
rows = ["Ext"]

[part.R1]
value = "1k"
footprint = "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P7.62mm_Horizontal"
symbol = "Device:R"

[part.R2]
value = "1k"
footprint = "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal"
symbol = "Device:R"

[part.R3]
value = "1k"
footprint = "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal"
symbol = "Device:R"

# 6.3 mm across, its leads in holes 5.08 mm apart: the 8 mm footprint is the
# nearest stock one at that spacing.
[part.C1]
value = "220uF 16V"
footprint = "Capacitor_THT:CP_Radial_D8.0mm_P5.00mm"
symbol = "Device:C_Polarized"

# Drawn as Q1: DIYLC draws it with a transistor's TO package.
[part.D1]
value = "MBRF2045CT"
footprint = "Package_TO_SOT_THT:TO-220F-3_Vertical"
symbol = "Device:D_Schottky_Dual_CommonCathode_AKA"
drawn = "Q1"
functions = ["A", "K", "A"]
