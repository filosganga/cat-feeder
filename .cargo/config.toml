[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6 --erase-data-parts ota"

[env]
ESP_LOG="info"

# No serial port is pinned here: the path is per machine and per board. The
# DEV-KIT exposes two ports and espflash may pick the wrong one — the CH343
# bridge carries the application's logs, while the Espressif "USB JTAG/serial
# debug unit" port shows only the bootloader. The Zero has only the latter.
# Find yours with `espflash list-ports --list-all-ports`, then either
# `export ESPFLASH_PORT=...` or pass `--port` to the dev scripts.

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imac-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
