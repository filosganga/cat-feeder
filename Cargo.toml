[package]
edition      = "2024"
name         = "cat-feeder"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "cat-feeder"
path = "./src/bin/main.rs"

# Which board this binary is for. One binary still flashes all three production
# units, because the device id comes from the MAC; the feature only selects the
# pin map and the serial interface.
#
#   cargo run                                                # dev kit
#   cargo run --no-default-features --features board-zero    # a Zero
#
# Features are additive, so selecting the Zero needs --no-default-features.
# Getting that wrong fails in esp-println's build script with "Exactly one of
# the following features must be enabled"; see src/board.rs.
[features]
default      = ["board-devkit"]
board-devkit = ["esp-println/uart"]
board-zero   = ["esp-println/jtag-serial"]

# Which OLED is attached. The default is the production part: the 0.91" 128x32
# that fits the original LCD window, and the geometry `display.rs` lays out for.
#
# A compile-time choice because ssd1306 takes the size as a *type* parameter,
# and it is not cosmetic — it sets the multiplex ratio, so a 128x64 panel
# initialised as 128x32 shows a garbled half-height image rather than a small
# one. The 1.3" 128x64 on the bench needs this; the layout is unchanged and
# simply leaves the bottom half dark.
panel-128x64 = []

# Portable dependencies. These build for the host too, so the pure-logic
# modules can be tested with `cargo test`.
[dependencies]
heapless = "0.9"
log      = "0.4.27"

# Everything that only exists on the board. Target-gated so a host test build
# does not try to compile esp-hal and friends for macOS or Linux; gating the
# modules alone is not enough, because cargo still builds the dependencies.
[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c6", "log-04", "unstable"] }

# The SSD1306 panel. Gated with everything else hardware-only: `display.rs`
# decides what to show and is host-tested, `oled.rs` pushes the pixels and is
# not, so the host test build needs neither of these.
#
# esp-hal 1.1.2 implements `embedded_hal::i2c::I2c` for `I2c<'_, Dm>` in any
# driver mode (src/i2c/master/mod.rs:680) and the async trait for `Async`
# (:1418), so the bus can be handed straight to this driver.
# `async` swaps the crate's whole API from embedded-hal to embedded-hal-async.
# Worth it: a 128x32 frame is 512 bytes, which at 400 kHz is milliseconds of
# blocking, and a blocking write inside an Embassy task stalls every other task
# -- including the one that counts switch edges.
ssd1306 = { version = "0.10.0", features = ["async"] }
embedded-graphics = "0.8.1"

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6", "log-04"] }

# Raw flash access, for the provisioning record in the nvs partition.
#
# Pinned to 0.9, NOT the latest. esp-storage tracks esp-hal closely: 0.10
# requires `esp-hal ~1.2.0-rc.0` and would drag the whole HAL onto a release
# candidate. 0.9 wants `~1.1.0-rc.0`, which the 1.1.2 pinned above satisfies.
# Check that requirement before bumping this.
esp-storage = { version = "0.9.0", features = ["esp32c6"] }

# DHCP server for setup mode: a phone joining the unit's access point needs
# an address before it can reach the form. Protocol codec only — the packets
# are moved by an embassy-net UdpSocket here, so no edge-nal adapter.
edge-dhcp = { version = "0.8.0", default-features = false }
# The traits esp-storage's FlashStorage implements. Its own dependency, but not
# re-exported, so it has to be named here to bring Read/Storage into scope.
embedded-storage = "0.3.1"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
# The output interface is NOT listed here: it comes from the board feature,
# because the dev kit needs `uart` and the Zero needs `jtag-serial`. See
# `[features]` and `src/board.rs`.
#
# `default-features = false` is still required. `auto`, `colors` and
# `critical-section` are the defaults, `auto` picks the wrong peripheral on the
# dev kit, and `auto` is mutually exclusive with both explicit interfaces — so
# it has to be dropped rather than overridden, which is why the other two are
# listed again.
esp-println = { version = "0.17.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32c6",
  "log-04",
  "timestamp",
] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c6",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
rust-mqtt = { version = "0.5.1", default-features = false, features = [
  "alloc",
  "log",
  "log-level-info",
  "v5",
] }
embassy-futures = "0.1.2"
embassy-sync = "0.7"

[build-dependencies]
toml = "1"

# For `examples/mkrecord.rs`, which reads the same cfg.toml build.rs does but
# runs on the host. Dev-dependencies are not compiled into the firmware.
[dev-dependencies]
heapless = "0.9"
toml     = "1"

# Builds a provisioning record for dev/provision.sh to flash.
#
# Host-only, and it needs `std`. A plain `cargo build` does not touch examples,
# so the board build is unaffected; `--examples` or `--all-targets` against the
# ESP32-C6 target will fail to find `std`, exactly as the host tests do in
# reverse. Build it the way dev/provision.sh does:
#
#   cargo run --example mkrecord --target "$(rustc -vV | awk '/^host:/{print $2}')"
[[example]]
name = "mkrecord"
path = "examples/mkrecord.rs"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
